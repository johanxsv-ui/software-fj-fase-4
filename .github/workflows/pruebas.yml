name: Pruebas Software FJ
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar sintaxis
        run: python -m compileall -q main.py software_fj tests
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Reproducir simulaciones
        run: python main.py --demo
